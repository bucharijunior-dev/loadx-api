<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeca('Veículos')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main>
    <div class="topo">
        <h1>Veículos</h1>
        <a class="botao" th:href="@{/veiculos/novo}">Novo veículo</a>
    </div>

    <p class="aviso ok" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="aviso erro" th:if="${erro}" th:text="${erro}"></p>

    <p th:if="${#lists.isEmpty(veiculos)}">Nenhum veículo cadastrado.</p>

    <p class="dica" th:unless="${#lists.isEmpty(veiculos)}">Clique no título de uma coluna para ordenar (clique de novo para inverter).</p>

    <table class="ordenavel" th:unless="${#lists.isEmpty(veiculos)}">
        <thead>
        <tr>
            <th>Descrição</th>
            <th>Tipo</th>
            <th>Eixos</th>
            <th>PBTC (kg)</th>
            <th>Tara (kg)</th>
            <th>Capacidade líquida (kg)</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${veiculos}">
            <td th:text="${v.descricao}">-</td>
            <td th:text="${v.tipo == 'CAMINHAO'} ? 'Caminhão' : 'Carreta'">-</td>
            <td th:text="${v.numeroEixos}">-</td>
            <td class="num" th:text="${#numbers.formatDecimal(v.pbtc, 1, 'POINT', 0, 'COMMA')}">0</td>
            <td class="num" th:text="${#numbers.formatDecimal(v.tara, 1, 'POINT', 0, 'COMMA')}">0</td>
            <td class="num" th:text="${#numbers.formatDecimal(v.capacidadeLiquida, 1, 'POINT', 0, 'COMMA')}">0</td>
            <td class="acoes">
                <a th:href="@{/veiculos/{id}/editar(id=${v.id})}">Editar</a>
                <form th:action="@{/veiculos/{id}/excluir(id=${v.id})}" method="post"
                      onsubmit="return confirm('Excluir este veículo?');">
                    <button type="submit" class="perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
